name: Ecs deployment

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Type yes to continue"
        required: true
        type: string

  push:
    branches:
      - main


permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ecsv2repo
  CODEDEPLOY_APP: ecsv2
  CODEDEPLOY_GROUP: example
  S3_BUCKET: blue-green-848153448908-codedeploy-revisions-v2
  TASK_DEFINITION_FAMILY: memo-task
  CONTAINER_NAME: ecs-url-shortener-container

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.inputs.deployment == 'yes'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Get image URI
        id: image
        run: |
          TAG=$(aws ecr describe-images \
          --repository-name ecsv2repo \
          --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
          --output text)

          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
          echo "No deployable image tag found in ECR repository ecsv2repo"
           exit 1
          fi

          REGISTRY=$(aws ecr describe-repositories \
          --repository-names ecsv2repo \
          --query 'repositories[0].repositoryUri' \
          --output text | cut -d'/' -f1)

          IMAGE_URI="$REGISTRY/ecsv2repo:latest"

          echo "IMAGE_URI=$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> $GITHUB_OUTPUT


      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Register new task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          jq --arg IMAGE "$IMAGE_URI" --arg NAME "${{ env.CONTAINER_NAME }}" '
            .containerDefinitions |= map(
              if .name == $NAME then .image = $IMAGE else . end
            )
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-definition.json > new-task-definition.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV
      
      - name: Show new task definition ARN
        run: |
          echo "$NEW_TASK_DEF_ARN"
     
      - name: Show task definition image
        run: |
          cat new-task-definition.json | jq '.containerDefinitions[] | {name,image}'
     
      - name: Update AppSpec with new task definition
        run: |
          sed -i "s|<TASK_DEFINITION>|$NEW_TASK_DEF_ARN|g" appspec.yaml
          cat appspec.yaml

      - name: Upload AppSpec to S3
        run: |
          zip appspec.zip appspec.yaml
          aws s3 cp appspec.zip s3://${{ env.S3_BUCKET }}/appspec.zip

      - name: Deploy with CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ env.CODEDEPLOY_GROUP }} \
            --s3-location bucket=${{ env.S3_BUCKET }},key=appspec.zip,bundleType=zip